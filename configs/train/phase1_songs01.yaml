config: configs/train/phase1_songs01.yaml
# Dataset inputs: processed gapped-audio directory + sample name (<ds_dir>/<sample>.json annotation).
ds_dir: data/processed/nuvole_bianche_short_gaps
sample: nuvole_bianche_multigap_4x_15ms_20ms_30ms_50ms
# If true, overwrite gap/seq_len/mask settings from the sample's JSON annotation recommendations.
auto_hparam: false

# Audio + codec: input wav, codec sample rate and EnCodec bandwidth (kbps); gap_*_s is the primary gap in seconds.
wav_path: data/processed/nuvole_bianche_short_gaps/nuvole_bianche_multigap_4x_15ms_20ms_30ms_50ms.wav
target_sr: 24000
bandwidth: 6.0
gap_start_s: 0.0
gap_end_s: 0.015

# Transformer size (max_len = positional-embedding table size in frames).
d_model: 256
n_heads: 4
n_layers: 4
max_len: 512
dropout: 0.1
# Max frame distance (clamped) used by the boundary-conditioning embeddings.
boundary_max_distance: 128

# Training window: frames per sample, and min/max masked-span length in frames (ctx_left/right: optional fixed context).
seq_len: 512
mask_len_min: 1
mask_len_max: 4
ctx_left: null
ctx_right: null

# Optimisation: AdamW with linear warmup then cosine decay to total_steps; grad_clip is global-norm.
batch_size: 16
lr: 0.0003
weight_decay: 0.01
betas: [0.9, 0.95]
grad_clip: 1.5
warmup_steps: 7000
total_steps: 100000

# Cadences in steps (0 disables): scalar logging, checkpoints, test-gap fill samples.
log_every: 1000
save_every: 100000
test_fill_every: 50000

# Validation: cadence in steps and fixed-pool construction (validation_strategy picks how the pool is built).
validation_every: 10000
validation_examples_per_band: 64
validation_batch_size: 16
validation_strategy: holdout_regions
validation_regions_per_band: 1
validation_region_len_frames: 1536
validation_region_min_separation_frames: 1124
validation_examples_per_length_band: 8
validation_mask_lengths: [1, 2, 3, 4]
validation_inspection_enabled: true
validation_inspection_examples_per_group: 1
validation_crop_context_frames: null
validation_save_artifacts: true
num_workers: 2

# Run bookkeeping: outputs go to <output_dir>/<run_name>; device 'auto' picks cuda when available.
output_dir: outputs/runs/phase1_data_scaling
run_name: phase1_songs01
seed: 42
device: cuda:0

# Resume from a checkpoint path; inpaint_only skips training and only runs inference (inpaint_iters refinement passes).
resume: null
inpaint_only: false
inpaint_iters: 1
inpaint_output: null

# Optional mask-length curriculum from curriculum_start_mask to curriculum_end_mask over curriculum_warmup_frac of training.
curriculum: false
curriculum_start_mask: 1
curriculum_end_mask: 4
curriculum_warmup_frac: 0.1
curriculum_schedule: linear

# Activity-aware window sampling: smoothing, low/high activity quantiles, dead-window thresholds, regime probabilities.
activity_smooth_kernel: 9
activity_low_quantile: 0.30
activity_high_quantile: 0.70
weighted_sampling: true

dead_window_min_mean: 0.005
dead_window_min_ratio: 0.01
regime_active_prob: 0.35
regime_transition_prob: 0.30
regime_low_prob: 0.20
regime_uniform_prob: 0.15

# Mask placement stride (frames) and whether masks are steered by the activity regimes above.
mask_stride: 1
activity_guided_masking: true

# Model variant: true = encoder-decoder infiller, false = joint (decoder-only style) infiller.
use_encoder_decoder: true
# Decoded-audio auxiliary loss (waveform L1 + multi-resolution STFT) on the codec-decoded prediction; log_eps floors the log-magnitude term.
decoded_loss_enabled: true
decoded_loss_weight: 0.10
decoded_loss_start_step: 7000
decoded_loss_every: 4
decoded_loss_max_items: 1
decoded_loss_margin_frames: 16
decoded_loss_temperature: 1.0
decoded_loss_waveform_l1_weight: 0.25
decoded_loss_stft_weight: 1.0
decoded_loss_spectral_convergence_weight: 1.0
decoded_loss_log_magnitude_weight: 1.0
decoded_loss_n_ffts: [512, 1024, 2048]
decoded_loss_hop_lengths: [128, 256, 512]
decoded_loss_win_lengths: [512, 1024, 2048]

# Training-stability and validation-metric options.
early_stopping_enabled: false   # re-run without patience: run the full budget or until NaN
nan_guard_enabled: true

validation_audio_metrics_enabled: true
validation_audio_metrics_max_examples: null

# Phase 1 data-scaling regime: 1 song (pivot only). No extra_wavs_dir set.
# Re-run (no patience): total_steps=100000, given.
