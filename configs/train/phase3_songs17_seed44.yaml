config: configs/train/phase3_songs17_seed44.yaml
ds_dir: data/processed/nuvole_bianche_short_gaps
sample: nuvole_bianche_multigap_4x_15ms_20ms_30ms_50ms
auto_hparam: false

wav_path: data/processed/nuvole_bianche_short_gaps/nuvole_bianche_multigap_4x_15ms_20ms_30ms_50ms.wav
target_sr: 24000
bandwidth: 6.0
gap_start_s: 0.0
gap_end_s: 0.015

d_model: 256
n_heads: 4
n_layers: 4
max_len: 512
dropout: 0.1
boundary_max_distance: 128

seq_len: 512
mask_len_min: 1
mask_len_max: 4
ctx_left: null
ctx_right: null

batch_size: 16
lr: 0.0003
weight_decay: 0.01
betas: [0.9, 0.95]
grad_clip: 1.0   # tightened from 1.5 after a gradient-explosion/NaN incident (see decoded_loss_log_eps below)
warmup_steps: 7000
# Phase 3 seed-robustness check: reduced from the parent's 1,000,000-step budget to
# 300,000 -- the songs17-vs-phase2_regularization contrast is already clearly visible by
# step 300k (see phase_3/README.md); re-running the full 1M-step budget x2 extra seeds
# would cost far more compute than the rest of this project combined. This is its own
# fully-scheduled 300k-step run (own cosine LR decay to zero at 300k), not the parent run
# truncated early.
total_steps: 300000

log_every: 1000
save_every: 100000
test_fill_every: 50000

validation_every: 10000
validation_examples_per_band: 64
validation_batch_size: 16
validation_strategy: holdout_regions
validation_regions_per_band: 1
validation_region_len_frames: 1536
validation_region_min_separation_frames: 1124
validation_examples_per_length_band: 8
validation_mask_lengths: [1, 2, 3, 4]
validation_inspection_enabled: true
validation_inspection_examples_per_group: 1
validation_crop_context_frames: null
validation_save_artifacts: true
num_workers: 2

output_dir: outputs/runs/phase3_seed_check
run_name: phase3_songs17_seed44
seed: 44
device: cuda:1

resume: null
inpaint_only: false
inpaint_iters: 1
inpaint_output: null

curriculum: false
curriculum_start_mask: 1
curriculum_end_mask: 4
curriculum_warmup_frac: 0.1
curriculum_schedule: linear

activity_smooth_kernel: 9
activity_low_quantile: 0.30
activity_high_quantile: 0.70
weighted_sampling: true

dead_window_min_mean: 0.005
dead_window_min_ratio: 0.01
regime_active_prob: 0.35
regime_transition_prob: 0.30
regime_low_prob: 0.20
regime_uniform_prob: 0.15

mask_stride: 1
activity_guided_masking: true

use_encoder_decoder: true
decoded_loss_enabled: true
decoded_loss_weight: 0.10
decoded_loss_start_step: 7000
decoded_loss_every: 4
decoded_loss_max_items: 1
decoded_loss_margin_frames: 16
decoded_loss_temperature: 1.0
decoded_loss_waveform_l1_weight: 0.25
decoded_loss_stft_weight: 1.0
decoded_loss_spectral_convergence_weight: 1.0
decoded_loss_log_magnitude_weight: 1.0
decoded_loss_n_ffts: [512, 1024, 2048]
decoded_loss_hop_lengths: [128, 256, 512]
decoded_loss_win_lengths: [512, 1024, 2048]
# Raised from the 1e-7 default: log(clamp_min(x, eps))'s gradient is 1/x, so a tiny eps lets
# near-silent STFT bins (common in low-activity windows) produce gradients as large as 1/eps
# (~1e7 at the old default). This run diverged at step 131,549 after ~9,400 steps of grad_norm
# spikes into the 10^4-10^6 range while grad_clip masked the effect on the loss -- raising this
# floor bounds that specific term's worst-case gradient at ~1/eps (~1e3 here) instead.
decoded_loss_log_eps: 0.001

early_stopping_enabled: false   # no patience, matching every Phase 1/2/3 run
nan_guard_enabled: true

validation_audio_metrics_enabled: true
validation_audio_metrics_max_examples: null

# Phase 1 data-scaling regime: 17 songs (pivot + all 16 remaining dataset/ tracks).
# dataset/008_* is excluded: it's a different recording of the pivot composition (Nuvole
# Bianche), so it contains the same material as the pivot's held-out validation regions.
extra_wavs_dir: dataset
extra_wavs_exclude: ["008_*"]
extra_wavs_limit: null
song_sampling: duration

# Phase 3 seed-robustness check, seed 44 of {43, 44} (plus the original seed 42 run) for the
# songs17-vs-phase2_regularization contrast. See phase_3/results/seed_check/README.md.
