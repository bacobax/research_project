config: configs/train/encodec_decoder_finetune.yaml

output_dir: outputs/runs/encodec_decoder
run_name: wav_test_song_decoder_finetune_important
seed: 42
device: "cuda:1"

wav_path: data/processed/multigap/wav_test_multigap_4x_1p0s_2p0s_5p0s_10p0s.wav
target_sr: 24000

encodec_model: encodec_24khz
bandwidth: 6.0

window_seconds: 8
hop_seconds: 4

batch_size: 8
lr: 0.0001
weight_decay: 0.0
betas: [0.9, 0.95]
grad_clip: 1.0

warmup_steps: 200
total_steps: 60000

log_every: 750
save_every: 7500
validation_every: 3750
validation_save_audio_every: 7500
patience: 6

resume: null
decoder_export_path: null

waveform_l1_weight: 1.0
waveform_l2_weight: 0.0
stft_weight: 1.0
stft_n_ffts: [512, 1024, 2048]
stft_hop_lengths: [128, 256, 512]
stft_win_lengths: [512, 1024, 2048]
