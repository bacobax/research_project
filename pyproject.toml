[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-infill"
version = "0.1.0"
description = "Config-driven audio infill training and dataset tools"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "encodec",
    "librosa",
    "matplotlib",
    "numpy",
    "pyyaml",
    "scipy>=1.17.1",
    "soundfile",
    "tensorboard",
    "torch",
    "torchviz",
    "tqdm",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
audio-infill-download = "audio_infill.download_data:main"
audio-infill-dataset = "audio_infill.make_gapped_dataset:main"
audio-infill-graph = "audio_infill.graph:main"
audio-infill-train = "audio_infill.train:main"

[dependency-groups]
dev = [
    "pytest",
]
notebooks = [
    "ipykernel>=7.4.0",
    "requests>=2.34.2",
    "torchaudio>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
